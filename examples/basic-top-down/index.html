<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Top-Down Game - THREE Play Example</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      body.aim-mode {
        cursor: none;
      }

      #gameContainer {
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        z-index: 100;
        font-size: 14px;
      }

      #instructions {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: white;
        z-index: 100;
        font-size: 12px;
        opacity: 0.8;
      }

      #crosshair {
        position: fixed;
        width: 32px;
        height: 32px;
        pointer-events: none;
        z-index: 1000;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.2s ease;
        display: none;
      }

      #crosshair.active {
        display: block;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="demo" />
    <div id="crosshair">
      <img
        src="./assets/textures/crosshair.svg"
        alt="crosshair"
        style="width: 100%; height: 100%"
      />
    </div>
    <!-- New Game UI -->
    <div class="game-ui">
      <!-- Debug Info (top left) -->
      <div class="debug-container">
        <div id="debug-display"></div>
      </div>

      <!-- Health Display (bottom left) -->
      <div class="radial-container health">
        <div id="health-display"></div>
      </div>

      <!-- Stamina Display (bottom right) -->
      <div class="radial-container stamina">
        <div id="stamina-display"></div>
      </div>

      <!-- Time Display (top center) -->
      <div class="time-container">
        <div id="time-display"></div>
      </div>

      <!-- Inventory (bottom center) -->
      <div class="inventory-container">
        <div id="inventory-display"></div>
      </div>
    </div>

    <div class="tutorial-overlay" id="tutorial" style="display: none">
      <div class="tutorial-content">
        <h2>Controls</h2>
        <ul>
          <li>
            Movement: <span class="key">W</span><span class="key">A</span
            ><span class="key">S</span><span class="key">D</span>
            or
            <span class="key up">⬆</span><span class="key down">⬆</span
            ><span class="key left">⬆</span><span class="key right">⬆</span>
          </li>

          <li>Run: <span class="key">Shift</span></li>
          <li>Throw an apple: <span class="key">Space</span></li>
        </ul>
        <p class="goal">Collect apples and throw them at your enemies!</p>
        <p class="goal">Watch your stamina, needed for running and throwing!</p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
