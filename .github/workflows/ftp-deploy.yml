name: FTP Deploy Basic Top-Down Example

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production

      - name: Install root dependencies
        run: npm ci

      - name: Build three-play engine
        run: npm run build

      - name: Install basic-top-down dependencies
        run: cd examples/basic-top-down && npm ci

      - name: Build basic-top-down example
        run: cd examples/basic-top-down && npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./examples/basic-top-down/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          description: 'Basic top-down example deployed successfully'

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
          description: 'Deployment failed'
